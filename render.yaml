# PolyglotAI - Render.com Deployment Config
# This file tells Render how to build and run your app

services:
  - type: web
    name: polyglotai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GROQ_API_KEY
        generateValue: false  # You'll set this in Render dashboard
